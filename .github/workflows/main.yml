name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry-X

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          # Инициализация (скачает autoninja, gn, ninja и др.)
          autoninja --version || true
          gclient --version || true

      - name: Clone MetalANGLEKit
        run: |
          cd ${{ github.workspace }}
          git clone --recursive https://github.com/Berstanio/MetalANGLEKit.git
          cd MetalANGLEKit
          ls -la
          echo "==> build-angle.sh:"
          cat build-angle.sh 2>/dev/null || echo "нет build-angle.sh"
          echo "==> angle directory:"
          ls -la angle/ 2>/dev/null | head -20 || echo "нет angle/"

      - name: Build MetalANGLEKit
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd ${{ github.workspace }}/MetalANGLEKit
          chmod +x *.sh 2>/dev/null || true
          ./build-angle.sh
        timeout-minutes: 90

      - name: Copy MetalANGLEKit
        run: |
          find ${{ github.workspace }}/MetalANGLEKit -name "MetalANGLEKit.framework" -type d
          FRAMEWORK=$(find ${{ github.workspace }}/MetalANGLEKit -name "MetalANGLEKit.framework" -type d | head -1)
          if [ -z "$FRAMEWORK" ]; then
            echo "❌ MetalANGLEKit.framework не собран"
            echo "==> Ищу любые .framework:"
            find ${{ github.workspace }}/MetalANGLEKit -name "*.framework" -type d
            exit 1
          fi
          mkdir -p ${{ github.workspace }}/Mindustry-X/ios/libs
          cp -Rv "$FRAMEWORK" ${{ github.workspace }}/Mindustry-X/ios/libs/

      - name: Copy Native Libraries
        run: |
          mkdir -p Mindustry-X/ios/libs
          cp -v Arc/natives/natives-freetype-ios/libs/libarc-freetype.a Mindustry-X/ios/libs/ || true

      - name: Grant execute permission for gradlew
        working-directory: Mindustry-X
        run: chmod +x ./gradlew

      - name: Build IPA
        working-directory: Mindustry-X
        run: ./gradlew createIpa --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ios-ipa
          path: Mindustry-X/ios/build/robovm/*.ipa
          if-no-files-found: error
