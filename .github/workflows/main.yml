name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry-X

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          export PATH="$HOME/depot_tools:$PATH"
          gclient --version || true

      - name: Clone MetalANGLEKit
        run: |
          cd ${{ github.workspace }}
          git clone https://github.com/Berstanio/MetalANGLEKit.git
          cd MetalANGLEKit
          ls -la

      - name: Build MetalANGLEKit
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd ${{ github.workspace }}/MetalANGLEKit
          chmod +x *.sh 2>/dev/null || true
          ./build-angle.sh Release
        timeout-minutes: 90

      - name: Copy MetalANGLEKit
        run: |
          echo "==> Ищу MetalANGLEKit.xcframework"
          find ${{ github.workspace }}/MetalANGLEKit -name "MetalANGLEKit.xcframework" -type d
          XCFW=$(find ${{ github.workspace }}/MetalANGLEKit -name "MetalANGLEKit.xcframework" -type d | head -1)

          if [ -z "$XCFW" ]; then
            echo "==> Не найден. Все framework/xcframework:"
            find ${{ github.workspace }}/MetalANGLEKit -name "*.framework" -type d
            find ${{ github.workspace }}/MetalANGLEKit -name "*.xcframework" -type d
            exit 1
          fi

          mkdir -p ${{ github.workspace }}/Mindustry-X/ios/libs
          cp -Rv "$XCFW" ${{ github.workspace }}/Mindustry-X/ios/libs/

          ARM64=$(find "$XCFW" -name "MetalANGLEKit.framework" -type d | grep -v simulator | head -1)
          if [ -n "$ARM64" ]; then
            ln -sf "$ARM64" "${{ github.workspace }}/Mindustry-X/ios/libs/MetalANGLEKit.framework"
            echo "[+] Симлинк создан: MetalANGLEKit.framework → $ARM64"
          fi

      - name: Copy Native Libraries
        run: |
          mkdir -p Mindustry-X/ios/libs
          cp -v Arc/natives/natives-freetype-ios/libs/libarc-freetype.a Mindustry-X/ios/libs/ || true

      - name: Grant execute permission for gradlew
        working-directory: Mindustry-X
        run: chmod +x ./gradlew

      - name: Build IPA
        working-directory: Mindustry-X
        run: ./gradlew createIpa --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ios-ipa
          path: Mindustry-X/ios/build/robovm/*.ipa
          if-no-files-found: error
