name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build IPA
        run: ./gradlew createIpa --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ios-ipa
          path: ios/build/robovm/*.ipa
          if-no-files-found: error
