name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry-X

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download prebuilt MetalANGLEKit
        run: |
          set -e
          mkdir -p /tmp/gdx-ios
          cd /tmp/gdx-ios

          # Пробуем разные версии libGDX — ищем ту, где есть MetalANGLE
          for V in 1.13.5 1.13.1 1.12.1; do
            echo "==> Пробую gdx-platform:$V:natives-ios"
            URL="https://repo1.maven.org/maven2/com/badlogicgames/gdx/gdx-platform/${V}/gdx-platform-${V}-natives-ios.jar"
            if wget -q --tries=3 --timeout=60 -O gdx.jar "$URL"; then
              echo "[+] Скачал $V"
              break
            fi
          done

          ls -la
          unzip -o gdx.jar -d extracted
          echo "==> Ищу MetalANGLEKit.framework"
          find extracted -name "MetalANGLEKit*" -type d
          find extracted -name "*.framework" -type d

          mkdir -p ${{ github.workspace }}/Mindustry-X/ios/libs
          FOUND=$(find extracted -name "MetalANGLEKit.framework" -type d | head -1)
          if [ -n "$FOUND" ]; then
            cp -Rv "$FOUND" ${{ github.workspace }}/Mindustry-X/ios/libs/
            echo "[+] MetalANGLEKit скопирован"
          else
            echo "[!] MetalANGLEKit.framework не найден в jar"
            exit 1
          fi

      - name: Copy Native Libraries
        run: |
          mkdir -p Mindustry-X/ios/libs
          cp -v Arc/natives/natives-freetype-ios/libs/libarc-freetype.a Mindustry-X/ios/libs/ || true

      - name: Grant execute permission for gradlew
        working-directory: Mindustry-X
        run: chmod +x ./gradlew

      - name: Build IPA
        working-directory: Mindustry-X
        run: ./gradlew createIpa --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ios-ipa
          path: Mindustry-X/ios/build/robovm/*.ipa
          if-no-files-found: error
