name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry-X

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Шаг 1: Клонируем и собираем MetalANGLEKit
      - name: Clone and build MetalANGLEKit
        run: |
          git clone https://github.com/libgdx/MetalANGLEKit.git
          cd MetalANGLEKit
          # Собираем фреймворк для arm64 (устройства)
          xcodebuild -project MetalANGLEKit.xcodeproj -scheme MetalANGLEKit -sdk iphoneos -configuration Release ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          # Копируем готовый фреймворк в проект Mindustry
          mkdir -p ${{ github.workspace }}/Mindustry-X/ios/libs
          cp -Rv build/Release-iphoneos/MetalANGLEKit.framework ${{ github.workspace }}/Mindustry-X/ios/libs/

      # Шаг 2: Копируем остальные нативные библиотеки
      - name: Copy Native Libraries
        run: |
          mkdir -p Mindustry-X/ios/libs
          cp -v Arc/natives/natives-freetype-ios/libs/libarc-freetype.a Mindustry-X/ios/libs/ || true

      - name: Grant execute permission for gradlew
        working-directory: Mindustry-X
        run: chmod +x ./gradlew

      - name: Build IPA
        working-directory: Mindustry-X
        run: ./gradlew createIpa --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ios-ipa
          path: Mindustry-X/ios/build/robovm/*.ipa
          if-no-files-found: error
