name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry-X

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Find MetalANGLEKit
        run: |
          find /Users/runner -name "MetalANGLEKit.xcframework" -type d 2>/dev/null | head -20
          find /Users/runner -name "*.xcframework" -path "*ios*" 2>/dev/null | head -20

      - name: Copy Native Libraries
        run: |
          mkdir -p Mindustry-X/ios/libs
          cp -v Arc/natives/natives-freetype-ios/libs/libarc-freetype.a Mindustry-X/ios/libs/ || true
          # Если найдёшь MetalANGLEKit.xcframework, добавь копирование:
          # cp -Rv /путь/к/MetalANGLEKit.xcframework Mindustry-X/ios/libs/

      - name: Grant execute permission for gradlew
        working-directory: Mindustry-X
        run: chmod +x ./gradlew

      - name: Build IPA
        working-directory: Mindustry-X
        run: ./gradlew createIpa --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ios-ipa
          path: Mindustry-X/ios/build/robovm/*.ipa
          if-no-files-found: error
