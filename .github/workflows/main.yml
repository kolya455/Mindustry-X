name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          path: Mindustry-X

      - name: Checkout Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          path: Arc

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download MetalANGLEKit
        run: |
          set -e

          echo "==> Ищу релизы MetalANGLEKit"
          API="https://api.github.com/repos/Berstanio/MetalANGLEKit/releases"
          RELEASE_JSON=$(curl -sL "$API")

          echo "$RELEASE_JSON" | grep -E '"tag_name"|"browser_download_url"' | head -40 || true

          ASSET_URLS=$(echo "$RELEASE_JSON" | grep '"browser_download_url"' | grep -oE 'https://[^"]+' | head -10 || true)

          mkdir -p /tmp/mak
          cd /tmp/mak

          for URL in $ASSET_URLS; do
            echo "==> Пробую $URL"
            FILENAME=$(basename "$URL")
            if curl -sL -o "$FILENAME" "$URL"; then
              echo "Скачал $FILENAME ($(du -h "$FILENAME" | cut -f1))"
              if [[ "$FILENAME" == *.zip ]]; then
                unzip -q -o "$FILENAME" -d "extracted_${FILENAME%.zip}" || true
              fi
            fi
          done

          echo "==> Ищу MetalANGLEKit.framework"
          find . -name "MetalANGLEKit.framework" -type d || true
          find . -name "MetalANGLEKit.xcframework" -type d || true

          FRAMEWORK=$(find . -name "MetalANGLEKit.framework" -type d | head -1)
          if [ -z "$FRAMEWORK" ]; then
            echo "❌ MetalANGLEKit.framework не найден в релизах"
            exit 1
          fi

          mkdir -p ${{ github.workspace }}/Mindustry-X/ios/libs
          cp -Rv "$FRAMEWORK" ${{ github.workspace }}/Mindustry-X/ios/libs/
          echo "[+] MetalANGLEKit скопирован в ios/libs"

      - name: Copy Native Libraries
        run: |
          mkdir -p Mindustry-X/ios/libs
          cp -v Arc/natives/natives-freetype-ios/libs/libarc-freetype.a Mindustry-X/ios/libs/ || true

      - name: Grant execute permission for gradlew
        working-directory: Mindustry-X
        run: chmod +x ./gradlew

      - name: Build IPA
        working-directory: Mindustry-X
        run: ./gradlew createIpa --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ios-ipa
          path: Mindustry-X/ios/build/robovm/*.ipa
          if-no-files-found: error
